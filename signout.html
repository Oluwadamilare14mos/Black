<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta-name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Out — Black</title>

  <link rel="icon" href="https://img.icons8.com/ios-filled/50/ff6600/t-shirt.png" />
  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: "#ff6600",
            accent: "#ff3300",
            dark: "#111827"
          },
          fontFamily: { poppins: ["Poppins", "sans-serif"] },
        },
      },
    };
  </script>

  <style>
    body { font-family: Poppins, sans-serif; }

    .fade-in { opacity: 0; transform: translateY(20px); animation: fadeIn 0.6s forwards; }
    @keyframes fadeIn { to { opacity:1; transform: translateY(0); } }

    .fade-out { animation: fadeOut 0.5s forwards; }
    @keyframes fadeOut { to { opacity:0; transform: scale(0.95); } }

    .spinner {
      border: 4px solid #ddd;
      border-top-color: #ff6600;
      border-radius: 50%;
      width: 35px;
      height: 35px;
      animation: spin 0.7s linear infinite;
      margin: auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>

<body class="min-h-screen flex items-center justify-center bg-gray-100">

  <div id="card" class="bg-white p-8 rounded-2xl shadow-lg w-full max-w-md text-center fade-in">

    <img id="userPhoto" class="w-24 h-24 rounded-full mx-auto mb-4 shadow-lg"
         src="https://img.icons8.com/ios-filled/100/000000/user.png" />

    <h2 id="userName" class="text-2xl font-bold text-dark mb-2">Loading...</h2>

    <p class="text-gray-600 mb-6">Are you sure you want to sign out?</p>

    <button id="logoutBtn"
      class="w-full py-3 bg-red-600 text-white rounded-full font-semibold text-lg hover:bg-red-700 transition">
      Yes, Sign Me Out
    </button>

    <a href="index.html" class="block mt-4 text-brand font-semibold text-sm">Cancel</a>
  </div>

  <div id="loadingOverlay"
       class="hidden fixed inset-0 bg-white/90 flex flex-col items-center justify-center">
      <div class="spinner"></div>
      <p class="mt-4 text-dark font-medium text-lg">Signing you out...</p>
  </div>

  <!-- Firestore (No Firebase Auth) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
    import {
      getFirestore,
      doc,
      getDoc
    } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDsrL5UHWeFtQAX5XCI1hX7As91PWz59Cs",
      authDomain: "black-1108.firebaseapp.com",
      projectId: "black-1108",
      storageBucket: "black-1108.appspot.com",
      messagingSenderId: "639439190327",
      appId: "1:639439190327:web:b08b640aba7e8f7d76c2b2"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const card = document.getElementById("card");
    const userName = document.getElementById("userName");
    const userPhoto = document.getElementById("userPhoto");
    const logoutBtn = document.getElementById("logoutBtn");
    const loadingOverlay = document.getElementById("loadingOverlay");

    // 🔐 Check session
    const userId = localStorage.getItem("blackUser");

    if (!userId) {
      window.location.href = "login.html";
    }

    // 📌 Load user info
    async function loadUser() {
      const userRef = doc(db, "users", userId);
      const snap = await getDoc(userRef);

      if (!snap.exists()) {
        localStorage.removeItem("blackUser");
        window.location.href = "login.html";
        return;
      }

      const data = snap.data();
      userName.textContent = data.firstName + " " + data.lastName;
      userPhoto.src = data.photoURL || "https://img.icons8.com/ios-filled/100/000000/user.png";
    }

    loadUser();

    // 🚪 Logout handler
    logoutBtn.addEventListener("click", () => {
      card.classList.add("fade-out");

      setTimeout(() => {
        card.classList.add("hidden");
        loadingOverlay.classList.remove("hidden");
      }, 400);

      // Clear session
      localStorage.removeItem("blackUser");

      setTimeout(() => {
        window.location.href = "login.html";
      }, 800);
    });
  </script>

</body>
</html>
